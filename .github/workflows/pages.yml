name: Build and publish homepage

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install image build dependency
        run: python -m pip install -r requirements.txt
      - name: Restore citation snapshot
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: content/citations.json
          key: openalex-counts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: openalex-counts-
      - name: Refresh OpenAlex citation counts
        run: python scripts/update-citations.py
      - name: Rebuild news
        run: python scripts/build-news.py
      - name: Prepare public website
        run: python scripts/prepare-site.py --base-url https://sven9r.github.io
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
